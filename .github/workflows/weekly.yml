name: "Generate Weekly"

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "30 10 * * 5"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to use (optional, e.g. v1.2.3). Leave empty to use latest release."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download binary
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(gh api /repos/HITSZ-OpenAuto/hoa-news/releases/latest --jq '.tag_name')"
          case "${RUNNER_ARCH}" in
            X64) ARCH=amd64 ;; ARM64) ARCH=arm64 ;; *) echo "Unsupported arch" && exit 1 ;;
          esac
          gh release download "${TAG}" --repo "HITSZ-OpenAuto/hoa-news" --pattern "hoa-news_${TAG}_linux_${ARCH}.tar.gz" --dir /tmp
          tar -xzf "/tmp/hoa-news_${TAG}_linux_${ARCH}.tar.gz" -C /tmp
          mv "/tmp/hoa-news_${TAG}_linux_${ARCH}" /usr/local/bin/hoa-news

      - name: Generate summary
        run: hoa-news weekly

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: update weekly summary"

          git reset --hard
          git clean -fd
          git pull --rebase origin "${GITHUB_REF_NAME}"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi

          branch="chore/weekly-news"
          echo "Direct push to ${GITHUB_REF_NAME} rejected by ruleset, creating PR via ${branch}..."
          git push --force origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr list --base "${GITHUB_REF_NAME}" --head "${branch}" --state open --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${branch}" \
              --title "docs: update weekly summary" \
              --body "Automated weekly summary update by GitHub Actions.")
          fi
          echo "PR: $pr_url"
          gh pr merge "$pr_url" --squash --delete-branch
